name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Opens one release pull request per project. Merging it tags `<project>/vX.Y.Z`
  # and creates the GitHub release.
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      episode: ${{ steps.release.outputs['episode--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publishing lives in this workflow because crates.io Trusted Publishing is
  # registered against release.yml, and a tag pushed with GITHUB_TOKEN does not
  # start other workflows.
  #
  # Trusted Publishing only works for a crate that already exists on crates.io.
  # For a crate's first release, put an API token in the crates-io environment
  # as CARGO_REGISTRY_TOKEN, then delete it once the trusted publisher is set up.
  publish-episode:
    needs: release-please
    if: needs.release-please.outputs.episode == 'true'
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      FIRST_PUBLISH_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    defaults:
      run:
        working-directory: episode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: env.FIRST_PUBLISH_TOKEN == ''
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || env.FIRST_PUBLISH_TOKEN }}
