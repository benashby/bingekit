[package]
name = "bingekit-episode"
version = "0.1.0"
description = "Episode information from media filenames (general and anime release names), and a viewing order for a folder of them"
readme = "README.md"
keywords = ["episode", "filename", "parser", "anime", "media"]
categories = ["parser-implementations", "multimedia::video"]
edition = "2024"
rust-version = "1.88"
license = "0BSD"
repository = "https://github.com/benashby/bingekit"
homepage = "https://github.com/benashby/bingekit/tree/main/episode"
authors = ["Ben Ashby <mail@benashby.com>"]
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
hunch = { version = "2.0.2", default-features = false }
regex = "1"

[dev-dependencies]
insta = { version = "1.48", features = ["glob"] }
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
